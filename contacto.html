<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Ponte en contacto con Tienda Tecnológica."><title>Contacto | Tienda Tecnológica</title><link rel="stylesheet" href="estiloProductos.css"><link rel="stylesheet" href="contactoEstilos.css"></head>
<body>
<main><section class="contacto"><h1>Contáctanos</h1><p>Déjanos tu consulta. Este formulario de demostración no envía correos.</p>
    <form id="formContacto"><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" autocomplete="name" required>
      <label for="email">Correo electrónico</label><input type="email" id="email" name="email" autocomplete="email" required>
      <label for="mensaje">Mensaje</label><textarea id="mensaje" name="mensaje" rows="5" required></textarea>
      <div class="botones"><button type="submit">Enviar consulta</button><button type="reset" class="secondary">Limpiar</button></div>
    </form><p id="respuesta" role="status" aria-live="polite"></p>
  </section></main><footer><p>Proyecto educativo de Sistemas Informáticos</p></footer><script src="contacto.js" defer></script>
</body></html>
